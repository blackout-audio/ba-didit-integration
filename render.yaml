services:
  - type: web
    name: ba-didit-integration
    env: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: ba-didit-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SQLITE_PATH
        value: /var/data/data.sqlite
      - key: CUSTOMER_EMAIL_PROVIDER
        value: flow
      - key: FLOW_METAFIELD_NAMESPACE
        value: didit
      - key: FRAUD_TRIGGER_TAG
        value: nofraud-review
      # Set these in Render dashboard:
      # APP_URL, SHOPIFY_API_KEY, SHOPIFY_API_SECRET,
      # DIDIT_API_KEY, DIDIT_WEBHOOK_SECRET
